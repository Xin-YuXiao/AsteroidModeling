# Tooling only: PCGS is run from the repository (README), not installed as a package.

[tool.ruff]
line-length = 120
target-version = "py310"
# upstream 2DGS / 3DGS code is kept as released (NOTICE.md)
extend-exclude = ["arguments", "gaussian_renderer", "scene", "utils", "submodules", "train.py", "render.py"]

[tool.ruff.lint]
# default rule set (E4, E7, E9, F); short loop names such as `l` for text lines are accepted
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
